<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 112" style="isolation:isolate"><path d="M62 6 L102 80 L22 80 Z" fill="%23EDAF2F" style="mix-blend-mode:multiply"/><rect x="12" y="48" width="58" height="58" rx="15" fill="%232823EE" style="mix-blend-mode:multiply"/><circle cx="90" cy="78" r="27" fill="%23E2452C" style="mix-blend-mode:multiply"/></svg>'>
<script>
/* LA GOFFINERIE v2.31 — the pricing page is retired: the prices live on the home page, in #pricing.
   This page only sends old links there (the meta refresh above does it without JavaScript),
   and keeps the language when the old address carried one (?lang=en|fr). */
(function(){
  var m=/[?&]lang=(en|fr)(?:&|$)/.exec(location.search);
  location.replace(m ? './?lang='+m[1]+'#pricing' : './#pricing');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Instrument+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#faf8f2;--ink:#151515;--ink-2:#3d4046;--blue:#2823EE;--disp:"Sora",system-ui,sans-serif;--sans:"Instrument Sans",system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;text-align:center;}
  main{max-width:34rem;display:flex;flex-direction:column;align-items:center;gap:14px;}
  svg{width:44px;height:41px;margin-bottom:6px;}
  p{font-size:17px;color:var(--ink-2);}
  a{font-family:var(--disp);font-weight:700;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--blue);}
  a:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px;}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 112" style="isolation:isolate" aria-hidden="true"><path d="M62 6 L102 80 L22 80 Z" fill="#EDAF2F" style="mix-blend-mode:multiply"/><rect x="12" y="48" width="58" height="58" rx="15" fill="#2823EE" style="mix-blend-mode:multiply"/><circle cx="90" cy="78" r="27" fill="#E2452C" style="mix-blend-mode:multiply"/></svg>
  <p><a href="./#pricing">Our prices are now on the home page →</a></p>
  <p lang="fr"><a href="./?lang=fr#pricing">Nos tarifs sont désormais sur la page d'accueil →</a></p>
</main>

</html>
