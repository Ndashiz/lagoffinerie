<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Carte de visite — La Goffinerie</title>
<!--
  LA GOFFINERIE — carte de visite, source des fichiers d'impression.
  Format fini 90 × 50 mm, fond perdu 2 mm de chaque côté → document 94 × 54 mm.
  Tout le texte et le logo restent à 4 mm au moins de la ligne de coupe (zone de sécurité).
  Page 1 = recto (marque, accroche, les trois services en bandeau), page 2 = verso (bandeau tricolore à gauche, Simon, contact, QR code).
  Rendu : node tools/render-business-card.mjs → export/recto.pdf, verso.pdf, carte.pdf (2 pages),
  recto.png, verso.png (600 dpi), apercu.png — le script vérifie aussi que le QR code se lit encore.
  ?guides  affiche la ligne de coupe (pointillés) et la zone de sécurité (rose) ; ?preview  montre les deux faces découpées.
  Le logo n'utilise pas mix-blend-mode : les zones de recouvrement sont peintes avec la couleur « multiply »
  déjà calculée, pour un PDF sans transparence (aucun aplatissement à faire chez l'imprimeur).
  Le QR code pointe sur https://lagoffinerie.be ; correction d'erreur H (30 %) pour que le logo puisse
  masquer la fenêtre centrale de 9 × 9 modules (40 modules noirs sur 841). Il est figé en SVG : rien à générer.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  /* 94.02 et non 94 : Chromium arrondit la largeur de page par pas de 1,2 pt (94 → 93,81 mm, 94,02 → 94,23 mm) ;
     la face fait toujours 94 × 54 mm, le reste est du papier dans le fond perdu */
  @page{size:94.02mm 54mm;margin:0;}
  :root{
    --paper:#faf8f2;--ink:#151515;--ink-2:#3d4046;
    --blue:#2823EE;--red:#E2452C;--yellow:#EDAF2F;
    --mono:"JetBrains Mono",monospace;--sans:"Instrument Sans",sans-serif;--disp:"Sora",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#d9d7d0;}
  body{font-family:var(--sans);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .defs{position:absolute;width:0;height:0;overflow:hidden;}

  .page{position:relative;width:94mm;height:54mm;overflow:hidden;background:var(--paper);}
  .face{position:absolute;inset:6mm;} /* zone de sécurité : 2 mm de fond perdu + 4 mm */
  @media screen{body{display:flex;flex-direction:column;align-items:flex-start;gap:8mm;padding:8mm;}}
  @media print{html,body{background:var(--paper);}.page{break-after:page;}.page:last-child{break-after:auto;}}

  /* ---- recto ---- */
  .recto .mark{position:absolute;right:-.6mm;top:46%;width:31mm;height:28.93mm;transform:translateY(-50%);}
  .recto .word{position:absolute;left:0;top:1.2mm;font-family:var(--disp);font-weight:800;font-size:19.5pt;line-height:1.02;letter-spacing:-.02em;}
  .recto .tag{position:absolute;left:0;top:20.4mm;font-size:8pt;line-height:1.38;color:var(--ink-2);}
  .recto .tag b{font-weight:700;color:var(--ink);}
  .u{position:relative;display:inline-block;white-space:nowrap;}
  .u svg{position:absolute;left:0;right:0;bottom:-.16em;width:100%;height:.3em;overflow:visible;}
  .u path{fill:none;stroke:var(--red);stroke-width:1.15;stroke-linecap:round;vector-effect:non-scaling-stroke;}
  /* les trois services, en bandeau sur toute la largeur sous le logo, chacun avec sa forme aux couleurs du site */
  .recto .svc{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:2.5mm;list-style:none;font-family:var(--mono);font-weight:600;font-size:5.1pt;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);white-space:nowrap;}
  .recto .svc li{display:flex;align-items:center;gap:1.4mm;}
  .recto .svc svg{width:2mm;height:2mm;flex:none;}

  /* ---- verso ---- */
  /* bandeau tricolore bord à bord sur la gauche : 6 mm dans le document, 4 mm une fois coupé (il va dans le fond perdu) */
  .verso .band{position:absolute;left:0;top:0;bottom:0;width:6mm;display:grid;grid-template-rows:1fr 1fr 1fr;}
  .verso .band i{display:block;}
  .verso .band i:nth-child(1){background:var(--yellow);}
  .verso .band i:nth-child(2){background:var(--blue);}
  .verso .band i:nth-child(3){background:var(--red);}
  .verso .face{inset:6mm 6mm 6mm 12mm;} /* 6 mm après le bandeau */
  .verso .who{position:absolute;left:0;top:0;}
  .verso .name{font-family:var(--disp);font-weight:800;font-size:12.5pt;line-height:1.1;letter-spacing:-.015em;}
  .verso .role{margin-top:1.7mm;display:flex;align-items:center;gap:1.8mm;font-family:var(--mono);font-weight:600;font-size:5.6pt;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);}
  .verso .role i{width:4mm;height:.5mm;background:var(--red);}
  .verso ul{position:absolute;left:0;bottom:-.3mm;list-style:none;display:grid;gap:1.55mm;}
  .verso li{display:flex;align-items:center;gap:2.2mm;font-size:7.6pt;font-weight:500;line-height:1;white-space:nowrap;}
  .verso li svg{width:2.3mm;height:2.3mm;flex:none;}
  /* 29 modules sur 17.5 mm → 0.6 mm par module ; zone de silence de 4 modules (2.4 mm) assurée par le fond autour */
  .verso .qr{position:absolute;right:0;bottom:0;width:17.5mm;height:17.5mm;}

  /* ---- ?guides : ligne de coupe + zone de sécurité ---- */
  .guides .page::before,.guides .page::after{content:"";position:absolute;pointer-events:none;}
  .guides .page::before{inset:2mm;border:.25mm dashed #777;}
  .guides .page::after{inset:6mm;border:.25mm solid #e0218a;}

  /* ---- ?preview : les deux faces telles qu'elles sortiront de la découpe ---- */
  html.preview,html.preview body{background:#e7e5df;}
  .preview body{padding:10mm;gap:10mm;}
  .preview .page{clip-path:inset(2mm round .6mm);filter:drop-shadow(0 .8mm 1.4mm rgba(0,0,0,.18));}
</style>
</head>
<body>

<svg class="defs" aria-hidden="true">
  <defs>
    <path id="m-t" d="M62 6 L102 80 L22 80 Z"/>
    <rect id="m-s" x="12" y="48" width="58" height="58" rx="15"/>
    <circle id="m-c" cx="90" cy="78" r="27"/>
    <clipPath id="clip-t"><use href="#m-t"/></clipPath>
    <clipPath id="clip-s"><use href="#m-s"/></clipPath>
    <!-- le logo du site (triangle, carré, rond en multiply), recouvrements pré-calculés -->
    <g id="mark">
      <use href="#m-t" fill="#EDAF2F"/>
      <use href="#m-s" fill="#2823EE"/>
      <use href="#m-c" fill="#E2452C"/>
      <use href="#m-s" fill="#25182C" clip-path="url(#clip-t)"/>  <!-- jaune × bleu -->
      <use href="#m-c" fill="#D22F08" clip-path="url(#clip-t)"/>  <!-- jaune × rouge -->
      <use href="#m-c" fill="#230929" clip-path="url(#clip-s)"/>  <!-- bleu × rouge -->
      <g clip-path="url(#clip-t)"><use href="#m-c" fill="#210608" clip-path="url(#clip-s)"/></g> <!-- les trois -->
    </g>
  </defs>
</svg>

<!-- RECTO -->

      <li><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 .6 9.6 9.2H.4Z" fill="#EDAF2F"/></svg>Digital Strategy</li>
      <li><svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.4" fill="#E2452C"/></svg>AI tool Automation</li>
    </ul>
  </div>
</section>

      <li><svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.4" fill="#E2452C"/></svg>lagoffinerie.be</li>
