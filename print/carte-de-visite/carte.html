<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Carte de visite — La Goffinerie</title>
<!--
  LA GOFFINERIE — carte de visite, source des fichiers d'impression.
  Format fini 90 × 50 mm, fond perdu 2 mm de chaque côté → document 94 × 54 mm.
  Tout le texte et le logo restent à 4 mm au moins de la ligne de coupe (zone de sécurité) ; seul le liseré
  bleu du haut va dans le fond perdu, pour s'imprimer bord à bord.
  Page 1 = recto (en-tête marque + accroche, Simon et son titre, coordonnées sur trois colonnes),
  page 2 = verso (logo et nom de la société, les trois services, QR code avec l'adresse).
  Rendu : node tools/render-business-card.mjs → export/recto.pdf, verso.pdf, carte.pdf (2 pages),
  recto.png, verso.png (600 dpi), apercu.png — le script vérifie aussi que le QR code se lit encore
  et que rien ne sort de la zone de sécurité.
  ?guides  affiche la ligne de coupe (pointillés) et la zone de sécurité (rose) ; ?preview  montre les deux faces découpées.
  Fond blanc pur (pas d'encre sur le fond, impression nette) ; le logo n'utilise pas mix-blend-mode : les zones de
  recouvrement sont peintes avec la couleur « multiply » déjà calculée, pour un PDF sans transparence.
  Le QR code pointe sur https://lagoffinerie.be ; correction d'erreur H (30 %) pour que le logo puisse
  masquer la fenêtre centrale de 9 × 9 modules (40 modules noirs sur 841). Il est figé en SVG : rien à générer.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  /* 94.02 et non 94 : Chromium arrondit la largeur de page par pas de 1,2 pt (94 → 93,81 mm, 94,02 → 94,23 mm) ;
     la face fait toujours 94 × 54 mm, le reste est du papier dans le fond perdu */
  @page{size:94.02mm 54mm;margin:0;}
  :root{
    --paper:#ffffff;--ink:#151515;--ink-2:#3d4046;--rule:#d9d6ce;
    --blue:#2823EE;--red:#E2452C;--yellow:#EDAF2F;
    --mono:"JetBrains Mono",monospace;--sans:"Instrument Sans",sans-serif;--disp:"Sora",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#d9d7d0;}
  body{font-family:var(--sans);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .defs{position:absolute;width:0;height:0;overflow:hidden;}

  .page{position:relative;width:94mm;height:54mm;overflow:hidden;background:var(--paper);}
  /* liseré bleu bord à bord en haut : 4.5 mm dans le document, 2.5 mm une fois coupé */
  .bar{position:absolute;left:0;top:0;right:0;height:4.5mm;background:var(--blue);}
  .face{position:absolute;inset:9.5mm 6mm 6mm 6mm;} /* zone de sécurité : 2 mm de fond perdu + 4 mm ; 5 mm sous le liseré */
  @media screen{body{display:flex;flex-direction:column;align-items:flex-start;gap:8mm;padding:8mm;}}
  @media print{html,body{background:var(--paper);}.page{break-after:page;}.page:last-child{break-after:auto;}}

  /* ---- recto : la personne ---- */
  .head{display:flex;align-items:center;justify-content:space-between;height:6mm;}
  .lockup{display:flex;align-items:center;gap:2mm;}
  .lockup .mark{width:6.4mm;height:5.97mm;flex:none;}
  .lockup b{font-family:var(--disp);font-weight:700;font-size:9.5pt;letter-spacing:-.01em;white-space:nowrap;}
  .head .tag{font-family:var(--mono);font-weight:500;font-size:5.2pt;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;}
  .rule{position:absolute;left:0;right:0;top:9.2mm;height:.25mm;background:var(--rule);}
  .who{position:absolute;left:0;top:14.2mm;}
  .name{font-family:var(--disp);font-weight:700;font-size:13pt;line-height:1;letter-spacing:-.015em;white-space:nowrap;}
  .role{margin-top:1.9mm;font-size:7.5pt;font-weight:500;line-height:1;color:var(--ink-2);white-space:nowrap;}
  .contacts{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:4mm;}
  .contacts dt{font-family:var(--mono);font-weight:500;font-size:4.8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:1.1mm;line-height:1;}
  .contacts dd{font-size:7pt;font-weight:500;line-height:1;white-space:nowrap;}

  /* ---- verso : la société ---- */
  .verso .face{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:3mm;}
  .brand .mark{width:15mm;height:14mm;flex:none;}
  .brand .word{font-family:var(--disp);font-weight:800;font-size:14pt;line-height:1;letter-spacing:-.02em;white-space:nowrap;}
  .svc{margin-top:2.2mm;padding-left:2.2mm;border-left:.35mm solid var(--blue);list-style:none;display:grid;gap:1.1mm;font-family:var(--mono);font-weight:500;font-size:5.2pt;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);line-height:1.2;white-space:nowrap;}
  /* 29 modules sur 18 mm → 0.62 mm par module ; zone de silence de 4 modules (2.5 mm) : du blanc tout autour */
  .scan{display:grid;justify-items:center;gap:2.6mm;}
  .scan .qr{width:18mm;height:18mm;}
  .scan span{font-size:6.2pt;font-weight:500;line-height:1;color:var(--ink-2);}

  /* ---- ?guides : ligne de coupe + zone de sécurité ---- */
  .guides .page::before,.guides .page::after{content:"";position:absolute;pointer-events:none;}
  .guides .page::before{inset:2mm;border:.25mm dashed #777;}
  .guides .page::after{inset:6mm;border:.25mm solid #e0218a;}

  /* ---- ?preview : les deux faces telles qu'elles sortiront de la découpe ---- */
  html.preview,html.preview body{background:#e7e5df;}
  .preview body{flex-direction:row;align-items:flex-start;padding:10mm;gap:10mm;}
  .preview .page{clip-path:inset(2mm round .6mm);filter:drop-shadow(0 .8mm 1.4mm rgba(0,0,0,.18));}
</style>
</head>
<body>

<svg class="defs" aria-hidden="true">
  <defs>
    <path id="m-t" d="M62 6 L102 80 L22 80 Z"/>
    <rect id="m-s" x="12" y="48" width="58" height="58" rx="15"/>
    <circle id="m-c" cx="90" cy="78" r="27"/>
    <clipPath id="clip-t"><use href="#m-t"/></clipPath>
    <clipPath id="clip-s"><use href="#m-s"/></clipPath>
    <!-- le logo du site (triangle, carré, rond en multiply), recouvrements pré-calculés -->
    <g id="mark">
      <use href="#m-t" fill="#EDAF2F"/>
      <use href="#m-s" fill="#2823EE"/>
      <use href="#m-c" fill="#E2452C"/>
      <use href="#m-s" fill="#25182C" clip-path="url(#clip-t)"/>  <!-- jaune × bleu -->
      <use href="#m-c" fill="#D22F08" clip-path="url(#clip-t)"/>  <!-- jaune × rouge -->
      <use href="#m-c" fill="#230929" clip-path="url(#clip-s)"/>  <!-- bleu × rouge -->
      <g clip-path="url(#clip-t)"><use href="#m-c" fill="#210608" clip-path="url(#clip-s)"/></g> <!-- les trois -->
    </g>
  </defs>
</svg>

<!-- RECTO -->

    </header>
    <div class="rule" aria-hidden="true"></div>
    <div class="who">
      <p class="name">Simon Goffin</p>
      <p class="role">Administrateur Général</p>
    </div>
    <dl class="contacts">
      <div><dt>Téléphone</dt><dd>+32 479 48 76 08</dd></div>
      <div><dt>E-mail</dt><dd>info@lagoffinerie.be</dd></div>
      <div><dt>Site</dt><dd>lagoffinerie.be</dd></div>
    </dl>
  </div>
</section>

<!-- VERSO -->
<section class="page verso" aria-label="Verso">
  <div class="bar" aria-hidden="true"></div>
  <div class="face">

    </div>
